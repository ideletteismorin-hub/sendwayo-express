name: SENDWAYO - daily Firebase backup
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
jobs:
  backup:
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Prepare service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Export Realtime Database
        run: |
          mkdir -p backup
          firebase database:get / --project sendwayo-express --json > "backup/sendwayo-rtdb-$(date -u +%Y-%m-%d).json"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: sendwayo-rtdb-backup-${{ github.run_number }}
          path: backup/*.json
          retention-days: 30
