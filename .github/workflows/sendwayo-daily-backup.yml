name: SENDWAYO - daily Firebase backup
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "::error title=SENDWAYO backup bloqueado::Falta el secreto FIREBASE_SERVICE_ACCOUNT en GitHub."
            exit 1
          fi
          echo "Credencial Firebase disponible."
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Prepare service account
        run: |
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Export Realtime Database
        run: |
          mkdir -p backup
          firebase database:get / --project sendwayo-express --json > "backup/sendwayo-rtdb-$(date -u +%Y-%m-%d).json"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: sendwayo-rtdb-backup-${{ github.run_number }}
          path: backup/*.json
          retention-days: 30
