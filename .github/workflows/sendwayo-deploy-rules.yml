name: SENDWAYO - deploy Firebase security rules
on:
  workflow_dispatch:
  push:
    paths:
      - 'database.rules.json'
jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "::error title=SENDWAYO reglas bloqueadas::Falta el secreto FIREBASE_SERVICE_ACCOUNT en GitHub."
            exit 1
          fi
          echo "Credencial Firebase disponible."
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Prepare service account
        run: |
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Validate rules JSON
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('Rules JSON OK')"
      - name: Deploy Realtime Database rules
        run: firebase deploy --only database --project sendwayo-express --non-interactive
