name: SENDWAYO syntax check
on:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript inside index.html
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]);
          let bad=0;
          scripts.forEach((s,i)=>{try{new Function(s); console.log('SCRIPT',i,'OK')}catch(e){bad++; console.error('SCRIPT',i,'ERROR:',e.stack)}});
          if(bad)process.exit(1);
          NODE
