name: Validate inline JavaScript
on:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate scripts
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          print("INLINE_SCRIPTS",len(blocks))
          for i,b in enumerate(blocks):
              open(f'/tmp/script_{i}.js','w',encoding='utf-8').write(b)
          PY
          for f in /tmp/script_*.js; do
            echo "CHECK $f"
            node --check "$f"
          done