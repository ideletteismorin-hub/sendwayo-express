name: Validar SENDWAYO EXPRESS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S|re.I)
          if not scripts:
              raise SystemExit("No se encontró JavaScript inline")
          for i,s in enumerate(scripts,1):
              p=Path(f"/tmp/sendwayo-{i}.js")
              p.write_text(s,encoding="utf-8")
              print(f"Script {i}: {len(s.splitlines())} líneas")
          print("Scripts encontrados:",len(scripts))
          PY
      - name: Comprobar sintaxis JavaScript
        run: |
          for f in /tmp/sendwayo-*.js; do
            echo "=== $f ==="
            node --check "$f"
          done
